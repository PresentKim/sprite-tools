name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        shell: bash
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt needed on:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: Build CLI
        run: go build -o sprite-tools.exe .

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Build GUI
        working-directory: gui
        run: wails build

      - name: Upload CLI
        uses: actions/upload-artifact@v4
        with:
          name: sprite-tools-cli
          path: sprite-tools.exe

      - name: Upload GUI
        uses: actions/upload-artifact@v4
        with:
          name: sprite-tools-gui
          path: gui/build/bin/sprite-tools-gui.exe
